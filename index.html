<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10182a"><meta name="description" content="A musical Advent calendar filled with music and memories.">
  <title>Musical Advent Calendar 2026</title><link rel="stylesheet" href="styles.css?v=20261111background1">
</head>
<body>
  <div id="snow" class="snow" aria-hidden="true"></div>
  <aside id="preview-banner" class="hidden" style="position:relative;z-index:2;padding:12px 18px;text-align:center;background:#e9c88a;color:#141d2f;font-weight:700">🔓 Admin preview — all 25 doors unlocked. This does not affect the normal public calendar. <a href="index.html" style="color:#141d2f;text-decoration:underline;margin-left:12px">Exit preview</a></aside>
  <main class="wrap" id="main">
    <header class="masthead"><div class="eyebrow">December 2026</div><h1 id="calendar-title">Musical Advent Calendar</h1><p id="calendar-subtitle" class="subhead hidden"></p></header>
    <section class="calendar-wrap" aria-label="Advent calendar doors">
      <div id="calendar-grid" class="calendar-grid"></div>
      <p id="calendar-footer" class="calendar-footer">A little surprise behind every door ✨</p>
    </section>
  </main>
  <dialog id="door-dialog" class="dialog" aria-labelledby="dialog-title">
    <div class="dialog-inner"><div class="dialog-head"><div><h2 id="dialog-title">Your surprise</h2></div><button class="close" id="close-door" aria-label="Close door">×</button></div>
      <img id="dialog-image" class="reveal-image hidden" alt="Door surprise"><div id="dialog-placeholder" class="placeholder-image hidden" aria-hidden="true">♫</div>
      <p class="reveal-message" id="dialog-message"></p><p class="reveal-song" id="dialog-song-title"></p><p class="reveal-artist" id="dialog-artist"></p>
    </div>
  </dialog>
  <div id="nowplaying" class="nowplaying hidden" role="status"><span aria-hidden="true">♫</span><div class="track"><small class="muted">Now playing</small><div class="trackname" id="playing-title"></div><small class="muted" id="playing-artist"></small><div class="seek-row"><span id="elapsed-time">0:00</span><input id="song-seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Seek within song"><span id="total-time">0:00</span></div></div><button id="toggle-play" aria-label="Pause or resume">❚❚</button><button id="stop-play" aria-label="Stop">×</button></div>
  <script src="calendar.js?v=20261111subtitle1" defer></script>
</body>
</html>
